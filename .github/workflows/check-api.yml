

name: Best Rarity Finder - API Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  check-api:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up and check API
        run: |
          for i in 1 2 3 4 5; do
            echo "Intento $i de 5..."
            if curl --fail --show-error --silent \
              --connect-timeout 20 \
              --max-time 60 \
              https://best-rarity-finder.onrender.com/api/health; then
              echo "API disponible."
              exit 0
            fi
            sleep 15
          done
          echo "La API no respondió tras 5 intentos."
          exit 1

      - name: Check TOP 10
        run: |
          curl --fail --show-error --silent \
            --connect-timeout 20 \
            --max-time 60 \
            https://best-rarity-finder.onrender.com/api/top10
